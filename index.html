<html lang="pt-BR">
    <head>
        <title>Loja de Café</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="menu-principal">
            <button class="botao-iniciar" onclick="iniciar()">Iniciar</button>
        </div>
        <div id="cafeteria" style="display: none;">
            <img id="bancada" src="imagens/bancada.png">
            <img id="cliente" src="">
            <div id="dialogo">
                <div id="pedido"></div>
                <button class="botao-ok" onClick="prepararPedido()">OK!</button>
            </div>
        </div>
        <div id="cozinha" style="display: none;">
            <img class="prateleira-top" src="imagens/fundo_cima.png">
            <img class="prateleira-bottom" src="imagens/fundo_baixo.png">
            <div id="xicaras"></div>
            <div id="cafeteira">
                <img src="imagens/cafeteira.png">
                <div id="quarto"></div>
                <div id="meio"></div>
                <div id="inteiro"></div>
            </div>
            <img id="leite" src="imagens/leite.png">
            <img id="acucar" src="imagens/acucar.png">
            <img id="canela" src="imagens/canela.png">
            <img id="adocante" src="imagens/adocante.png">
            <img id="marshmallows" src="imagens/marshmallows.png">
            <img id="chantilly" src="imagens/chantilly.png">
            <div id="pia"></div>
        </div>
    </body>
</html>
