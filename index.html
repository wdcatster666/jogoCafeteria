<html lang="pt-BR">
    <head>
        <title>Loja de Café</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="menu-principal">
            <button class="botao-iniciar" onclick="iniciar()">Iniciar</button>
        </div>
        <div id="informacoes">
            <div id="fichaPedido" style="display: none;">
                <img id="notinha" src="imagens/nota_pedido.png" onclick="exibirFicha()">
                <div id="nomePedido"></div>
                <div id="nomeAcomp"></div>
                <div id="ingredientes"></div>
            </div>
            <div id="paciencia" style="display: none;"></div>
            <div id="containerQntDinheiro" style="display: none;">
                <div id="qntDinheiro"></div>
            </div>
            <img id="capaCardapio" src="imagens/cardapio.png" style="display: none;">
            <img id="btnPause" src="imagens/botao_pause.png" style="display: none;">
        </div>
        <div id="cafeteria" style="display: none;">
            <img id="bancada" src="imagens/bancada.png">
            <img id="cliente" src="">
            <div id="dialogo">
                <div id="pedido"></div>
                <button class="botao-ok" onclick="prepararPedido()">OK!</button>
            </div>
        </div>
        <div id="cozinha" style="display: none;">
            <img class="prateleira-top" src="imagens/fundo_cima.png">
            <img class="prateleira-bottom" src="imagens/fundo_baixo.png">
            <div id="xicaras" onclick="pegarXicara()"></div>
            <div id="cafeteira">
                <img src="imagens/cafeteira.png" onclick="colocarNaCafeteira()">
                <div id="quarto" onclick="pegarCafe('quarto')"></div>
                <div id="meio" onclick="pegarCafe('meio')"></div>
                <div id="inteiro" onclick="pegarCafe('inteiro')"></div>
            </div>
            <img id="leite" src="imagens/leite.png" onclick="pegarLeite()">
            <img id="acucar" src="imagens/acucar.png" onclick="pegarAcucar()">
            <img id="canela" src="imagens/canela.png" onclick="pegarCanela()">
            <img id="adocante" src="imagens/adocante.png" onclick="pegarAdocante()">
            <img id="marshmallows" src="imagens/marshmallows.png" onclick="pegarMarshmallow()">
            <img id="chantilly" src="imagens/chantilly.png" onclick="pegarChantilly()">
            <div id="pia" onclick="jogarFora()"></div>
            <img id="xcrPedido" src="imagens/xicara.png" style="display: none;">
        </div>
        <div id="aviso" style="display: none;"></div>
    </body>
</html>
